<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>হারু চাষী</title>
<style>
:root{--ink:#3b2410;--gold:#f6b93b;--cream:#fff6dc;--red:#d63031;--green:#2d8a4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;background:#87ceeb;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;color:var(--ink)}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#8fd3f4 0%,#fde8b0 55%,#f9c46b 70%)}
.abs{position:absolute}
#sun{left:62%;top:7%;width:78px;height:78px;border-radius:50%;background:radial-gradient(#fff3b0,#ffc93c 60%,#ff9f1c);box-shadow:0 0 50px 20px #ffd16666;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.cl{height:26px;width:80px;background:#fff;border-radius:30px;opacity:.9;animation:drift linear infinite}
.cl:before,.cl:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl:before{width:36px;height:36px;left:12px;top:-16px}.cl:after{width:28px;height:28px;left:40px;top:-10px}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.bd{font-size:18px;animation:fly linear infinite}
@keyframes fly{from{transform:translate(-40px,0)}50%{transform:translate(50vw,-20px)}to{transform:translate(110vw,10px)}}
#hills{left:-5%;right:-5%;top:34%;height:22%;background:#7fb069;border-radius:50% 50% 0 0}
#field{left:0;right:0;top:44%;height:30%;background:repeating-linear-gradient(100deg,#e9b949 0 14px,#f2cd63 14px 28px);transform-origin:bottom;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{to{filter:brightness(1.08)}}
.tree{font-size:62px;bottom:auto;top:30%}
#river{left:0;right:0;top:68%;height:14%;background:linear-gradient(#4aa3df,#2a7fba);overflow:hidden}
.wave{position:absolute;left:-50%;width:200%;height:14px;background:repeating-radial-gradient(circle at 10px 14px,transparent 0 8px,#ffffff55 9px 10px);animation:wv 6s linear infinite}
@keyframes wv{to{transform:translateX(25%)}}
#boat{font-size:46px;top:63.5%;left:0;animation:boat 28s linear infinite}
@keyframes boat{from{transform:translateX(-60px)}to{transform:translateX(110vw)}}
#ground{left:0;right:0;top:80%;bottom:0;background:linear-gradient(#6aa84f,#3f7d32)}
#farmer{bottom:4%;left:50%;width:min(52vw,230px);transform:translateX(-50%)}
#farmer svg{width:100%;overflow:visible}
.blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.brow{animation:brow 3s ease-in-out infinite}
@keyframes brow{50%{transform:translateY(-4px)}}
.arm{transform-origin:62px 150px;transform-box:view-box;animation:scr 2.4s ease-in-out infinite}
@keyframes scr{0%,100%{transform:rotate(0)}40%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.hop{animation:hop .6s 2}
@keyframes hop{50%{transform:translateX(-50%) translateY(-40px)}}
.sweat{animation:sw 2.5s infinite;opacity:0}
@keyframes sw{50%{opacity:.9;transform:translateY(6px)}}

/* thought cloud */
#cloud{left:50%;top:6%;transform:translateX(-50%);width:min(92vw,400px);background:#fff;border-radius:40px;padding:16px 10px 14px;box-shadow:0 6px 0 #00000015;text-align:center;transition:.4s}
#cloud:after{content:"";position:absolute;bottom:-22px;left:46%;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:12px 16px 0 -3px #fff}
#cloud.hide{opacity:0;transform:translateX(-50%) scale(.6);pointer-events:none}
#story{font-size:15px;margin:0 8px 10px;font-weight:600}
#items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.it{background:var(--cream);border:2px solid var(--gold);border-radius:18px;padding:8px 10px;min-width:92px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);animation:fl 3s ease-in-out infinite}
.it:nth-child(2n){animation-delay:.7s}.it:nth-child(3n){animation-delay:1.3s}
.it b{display:block;font-size:30px;line-height:1.1}
.it:active{transform:scale(1.15)}
@keyframes fl{50%{transform:translateY(-5px)}}

/* bubble */
#bubble{left:50%;top:5%;transform:translateX(-50%) scale(.7);width:min(92vw,400px);background:#fff;border:3px solid var(--ink);border-radius:26px;padding:16px;opacity:0;pointer-events:none;transition:.3s;text-align:center;max-height:60%;overflow:auto}
#bubble.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
#bubble h3{font-size:19px;margin-bottom:12px;line-height:1.4}
.big{font-size:54px;display:block;animation:fl 2s infinite}
.btn{display:block;width:100%;margin-top:9px;padding:13px;border:0;border-radius:16px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--green);box-shadow:0 4px 0 #1b5c33}
.btn.o{background:#e17055;box-shadow:0 4px 0 #a8402a}.btn.y{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b9851a}.btn.g{background:#636e72;box-shadow:0 4px 0 #3d4548}
.btn:active{transform:translateY(3px);box-shadow:none}
.shake{animation:shk 1.6s infinite}
@keyframes shk{0%,80%,100%{transform:none}84%{transform:translateX(-5px)}88%{transform:translateX(5px)}92%{transform:translateX(-4px)}96%{transform:translateX(3px)}}
a.btn{text-decoration:none}
.pulse{animation:pl 1.2s infinite}
@keyframes pl{0%{box-shadow:0 4px 0 #1b5c33,0 0 0 0 #2d8a4eaa}100%{box-shadow:0 4px 0 #1b5c33,0 0 0 18px #2d8a4e00}}

/* manager card */
#card{left:50%;top:50%;width:min(90vw,360px);transform:translate(-50%,-50%) translateY(120vh);background:var(--cream);border:3px solid var(--ink);border-radius:28px;padding:18px;text-align:center;transition:transform .8s cubic-bezier(.2,1.3,.4,1);z-index:20;max-height:94%;overflow:auto}
#card.on{transform:translate(-50%,-50%)}
#card img{width:118px;height:118px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:4px solid var(--gold);box-shadow:0 0 0 4px var(--ink)}
.ver{display:inline-block;margin:8px 0;background:#0984e3;color:#fff;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700}
.row{display:flex;justify-content:space-between;background:#fff;border-radius:12px;padding:7px 12px;margin:6px 0;font-size:14px}
.cond{background:var(--red);color:#fff;border-radius:14px;padding:10px;margin:10px 0;font-weight:700;font-size:15px;animation:glow 1.4s infinite alternate}
@keyframes glow{to{box-shadow:0 0 16px 3px #ff7675}}
.conf{position:fixed;top:-20px;font-size:22px;z-index:30;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:40;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:20px}
#lang{position:fixed;inset:0;z-index:60;background:linear-gradient(#ffe29f,#ffa99f);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:6px;transition:opacity .5s}
#lang h1{font-size:30px;text-align:center;line-height:1.3;margin-bottom:6px}
#lang p{margin-bottom:14px;opacity:.8}
#lang .btn{max-width:320px;font-size:20px;padding:16px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ink);border:2px solid var(--ink)}
#lang.off{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

#sun{width:104px;height:104px;top:6%}
.tree{font-size:92px;top:27%}.bd{font-size:28px}
#river{top:66%;height:16%}#boat{font-size:66px;top:61%}
#farmer{width:min(54vw,215px);bottom:1%}
#farmer svg{animation:br 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes br{50%{transform:scaleY(1.025)}}
#bigtree{left:50%;transform:translateX(-50%);bottom:1%;width:min(118vw,470px);overflow:visible}
#canopy{transform-box:view-box;transform-origin:200px 230px;animation:csw 5s ease-in-out infinite alternate}
@keyframes csw{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.lf{position:absolute;font-size:22px;top:38%;opacity:0;animation:lf 7s linear infinite}
@keyframes lf{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(30px,150px) rotate(180deg)}100%{transform:translate(-20px,330px) rotate(400deg);opacity:0}}
#bm{right:-50%;top:56%;transition:right 1.6s cubic-bezier(.3,1.2,.5,1);text-align:center;z-index:6}
#bm.in{right:4%}
#bm .h{font-size:50px;display:block;margin-bottom:-20px;animation:fl 2s infinite}
#bm .b{font-size:92px;display:block;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px) rotate(3deg)}}
#cloud{z-index:10}#bubble{z-index:11}
#bigtree{width:min(100vw,400px)}

function type(el,txt,done){clearInterval(tm);el.textContent="";let i=0;const a=[...txt];tm=setInterval(()=>{el.textContent+=a[i++]||"";if(i>=a.length){clearInterval(tm);done&&done()}},45)}
function bub(html){const b=$("bubble");b.innerHTML=html;b.classList.add("on");$("cloud").classList.add("hide")}
function boatman(on){$("bm").classList.toggle("in",on)}
function intro(i){const t=T[L];boatman(false);$("card").classList.remove("on");if(i>=2){home();return}
 bub(`<span class="big">${i?"💭":"🌾"}</span><h3 id="st"></h3><button class="btn" id="nx">${t.next}</button>`);type($("st"),t[i?"s2":"s1"]);$("nx").onclick=()=>intro(i+1)}
function home(){boatman(false);$("bubble").classList.remove("on");$("card").classList.remove("on");$("cloud").classList.remove("hide");const t=T[L];type($("story"),t.story);
 $("items").innerHTML=t.items.map((n,i)=>`<button class="it" data-i="${i}"><b>${E[i]}</b>${n}</button>`).join("");
 document.querySelectorAll(".it").forEach(b=>b.onclick=()=>ask(+b.dataset.i))}
function ask(i){const t=T[L];bub(`<span class="big">${E[i]}</span><h3>${t.ask}</h3>
 <button class="btn" id="m1">${t.mgr}</button><button class="btn o shake" id="m2">${t.money}</button><button class="btn g" id="m0">${t.back}</button>`);
 $("m1").onclick=trust;$("m2").onclick=()=>moneyMsg(i);$("m0").onclick=home}
function moneyMsg(i){const t=T[L];bub(`<span class="big">😭💸</span><h3 id="mm"></h3><button class="btn g" id="bk">${t.back}</button>`);type($("mm"),t.moneyMsg);$("bk").onclick=()=>ask(i)}
function trust(){const t=T[L];boatman(false);bub(`<span class="big">🤔</span><h3>${t.trust}</h3>
 <button class="btn" id="t1">${t.tr}</button><button class="btn o" id="t2">${t.nt}</button><button class="btn y" id="t3">${t.dk}</button>`);
 $("t1").onclick=manager;
 $("t2").onclick=()=>{boatman(true);bub(`<span class="big">🛶</span><h3>${t.ntMsg}</h3><button class="btn y" id="r">${t.ok}</button>`);$("r").onclick=trust};
 $("t3").onclick=()=>{boatman(true);bub(`<span class="big">🛶</span><h3>${t.boat}</h3><button class="btn" id="r">${t.tr}</button>`);$("r").onclick=manager}}
function confetti(){for(let i=0;i<30;i++){const c=document.createElement("div");c.className="conf";c.textContent=["🎉","✨","🌾","🎊"][i%4];c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}
function manager(){const t=T[L];boatman(false);$("bubble").classList.remove("on");
 $("card").innerHTML=`<img src="assets/manager.jpg" alt=""><h3 style="margin-top:8px">${t.name}</h3><div class="ver">${t.ver}</div>
 <div class="row"><span>${t.sal}</span><b>${t.sv}</b></div><div class="row"><span>${t.exp}</span><b>${t.ev}</b></div>
 <div class="cond">${t.cond}</div><h3 style="font-size:16px">${t.help}</h3>
 <a class="btn pulse" href="tel:${PHONE}" id="call" style="margin-top:8px">${t.call}</a><button class="btn g" id="x">${t.back}</button>`;
 $("card").classList.add("on");$("x").onclick=home;
 const f=$("farmer");f.classList.remove("hop");void f.offsetWidth;f.classList.add("hop");
 confetti();if(navigator.vibrate)$("call").addEventListener("click",()=>navigator.vibrate(60))}

document.querySelectorAll("#lang .btn").forEach(b=>b.onclick=()=>{L=b.dataset.l;ls("lang",L);document.documentElement.lang=L;$("lang").classList.add("off");startSound();intro(0)});
const saved=ls("lang");if(saved&&T[saved]){L=saved;$("lang").classList.add("off");intro(0);
 document.body.addEventListener("pointerdown",function s(){startSound();document.body.removeEventListener("pointerdown",s)})}
</script></body></html>
